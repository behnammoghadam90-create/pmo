<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#primaryGrad)" filter="url(#shadow)" />
  <rect x="8" y="8" width="104" height="104" rx="24" fill="none" stroke="url(#skyGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Industrial Geometric Structure / Pillars / Factory / Tower -->
  <!-- Left Pillar / Structure -->
  <rect x="26" y="52" width="14" height="38" rx="4" fill="#ffffff" fill-opacity="0.95" />
  
  <!-- Center Main Tower -->
  <rect x="44" y="34" width="16" height="56" rx="4" fill="#ffffff" />
  <rect x="48" y="40" width="8" height="12" rx="2" fill="#4f46e5" fill-opacity="0.8" />
  <rect x="48" y="58" width="8" height="12" rx="2" fill="#4f46e5" fill-opacity="0.8" />

  <!-- Right Ascending Progress Step -->
  <rect x="64" y="44" width="14" height="46" rx="4" fill="#ffffff" fill-opacity="0.95" />

  <!-- Dynamic Golden Progress Orbit / S-Curve Swirl -->
  <path d="M 22 72 C 36 66, 44 48, 62 42 C 78 36, 92 46, 96 54" fill="none" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Project Management Diamond / Star Milestone -->
  <circle cx="96" cy="54" r="5" fill="#f59e0b" />
  <circle cx="96" cy="54" r="2" fill="#ffffff" />
  
  <!-- Modern Industrial Gear Hint (Subtle Top Left) -->
  <circle cx="33" cy="38" r="4.5" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" />
</svg>
